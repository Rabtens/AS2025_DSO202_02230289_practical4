# argocd-app.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: my-webapp
  namespace: argocd # Argo CD Applications ALWAYS live in the argocd namespace
spec:
  project: default

  # 1. WHERE IS THE DESIRED STATE? (GitHub)
  source:
    repoURL: https://github.com/<YOUR-GITHUB-USERNAME>/dso202-gitops-demo.git
    targetRevision: HEAD
    path: manifests

  # 2. WHERE SHOULD IT BE DEPLOYED? (Our Kind Cluster)
  destination:
    server: https://kubernetes.default.svc
    namespace: demo-app

  # 3. HOW SHOULD ARGO CD SYNC IT?
  syncPolicy:
    automated:
      prune: true      # Delete K8s resources if deleted from Git
      selfHeal: true   # Revert manual kubectl changes automatically
    syncOptions:
      - CreateNamespace=true
